# Снимок прайса для сайта: в 13:20 МСК (10:20 UTC) и запасной в 14:00 МСК (11:00 UTC), забирает лист «Товары» из Google-таблицы
# (таблица обновляется сама около 13:00 МСК: триггер atHour(13).nearMinute(0), ±15 минут)
# и сохраняет в data/products.csv. Сайт показывает этот снимок, поэтому утренние правки прайса на сайт не попадают.
# GitHub запускает расписание с опозданием ~на час, поэтому с 13:05 МСК до сегодняшнего снимка сайт читает таблицу напрямую
# (дата снимка — data/products-date.txt).
# Защита: если строк стало меньше 60% от прошлого снимка (прайс не заполнен) — снимок не меняется.
# Обновить вручную: вкладка Actions → «Прайс для сайта» → Run workflow.
name: Прайс для сайта (13:20 и 14:00 МСК)
on:
  schedule:
    - cron: '20 10 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Забрать лист «Товары»
        run: |
          python3 - <<'PY'
          import csv, io, os, sys, urllib.request
          U = 'https://script.google.com/macros/s/AKfycbwixokKVJTAXbBrUyAKSM4PXlGPJ7oj_ehd-aBUDloCnUZ5aDlMx4P5YFgNqH3rljSD/exec?s=products'
          new = urllib.request.urlopen(U, timeout=60).read().decode('utf-8')
          n = lambda t: max(0, len(list(csv.reader(io.StringIO(t)))) - 1)
          p = 'data/products.csv'
          old = open(p, encoding='utf-8').read() if os.path.exists(p) else ''
          print('строк было:', n(old), 'стало:', n(new))
          if n(new) < 20 or (old and n(new) < n(old) * 0.6):
              print('::warning::Прайс похож на незаполненный — снимок не обновлён'); sys.exit(0)
          # Защита от опечаток поставщика: строка дешевле 40% медианы своей модели (при 3+ строках) не попадает на сайт
          import statistics
          rows = list(csv.reader(io.StringIO(new))); h = rows[0]; iM, iP = h.index('Модель'), h.index('Цена')
          num = lambda x: int(x[iP]) if len(x) > iP and x[iP].isdigit() else None
          by = {}
          for x in rows[1:]:
              if num(x): by.setdefault(x[iM], []).append(num(x))
          bad = lambda x: num(x) and len(by[x[iM]]) >= 3 and num(x) < 0.4 * statistics.median(by[x[iM]])
          for x in rows[1:]:
              if bad(x): print('::warning::Подозрительная цена, строка скрыта:', ','.join(x[:9]))
          buf = io.StringIO(); csv.writer(buf, lineterminator='\n').writerows([rows[0]] + [x for x in rows[1:] if not bad(x)]); new = buf.getvalue()
          os.makedirs('data', exist_ok=True)
          open(p, 'w', encoding='utf-8').write(new)
          # дата снимка (МСК): пока сегодняшнего снимка нет, сайт после 13:05 читает таблицу напрямую (youz.js snapStale)
          import datetime
          open('data/products-date.txt', 'w').write((datetime.datetime.utcnow() + datetime.timedelta(hours=3)).strftime('%Y-%m-%d') + '\n')
          PY
      - name: Сохранить снимок
        run: |
          git config user.name "prajs-bot"
          git config user.email "prajs-bot@users.noreply.github.com"
          git add data/products.csv data/products-date.txt
          git diff --cached --quiet && echo "Цены не изменились" || git commit -m "Прайс для сайта $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M') МСК" && git push
