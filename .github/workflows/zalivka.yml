# Заливка сайта на хостинг reg.ru (Хост-0, server19.hosting.reg.ru) по FTPS.
# Берёт папку site/ и кладёт в www/youz.store/ на хостинге. Заливает только изменённые файлы.
# Запуск: сам при изменении site/ в main и после «Сборки сайта», или вручную: Actions → «Заливка на хостинг» → Run workflow.
# Доступ задаётся в Settings → Secrets and variables → Actions: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# Заявки: секрет TG_TOKEN (бот @youz_store_zayavki_bot), по желанию MAX_TOKEN и MAX_CHAT.
# Из них собирается www/lead-config.php (вне папки сайта, в git его нет). Заявки идут в группу
# «Менеджеры ЮZ», тема «Заявки с сайта».
name: Заливка на хостинг
on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_run:            # коммиты робота (GITHUB_TOKEN) не запускают push, поэтому ждём «Сборку сайта»
    workflows: ['Сборка сайта']
    types: [completed]
  workflow_dispatch:
concurrency:
  group: zalivka
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Проверка доступа
        id: chk
        env:
          S: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$S" ]; then echo "Нет секрета FTP_SERVER — заливка пропущена"; echo "ok=no" >> $GITHUB_OUTPUT; else echo "ok=yes" >> $GITHUB_OUTPUT; fi
      - name: htaccess.txt → .htaccess (GitHub не принимает скрытые файлы через загрузку)
        if: steps.chk.outputs.ok == 'yes'
        run: cp site/htaccess.txt site/.htaccess
      - name: Настройки заявок (lead-config.php) из секретов
        if: steps.chk.outputs.ok == 'yes'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          MAX_TOKEN: ${{ secrets.MAX_TOKEN }}
          MAX_CHAT: ${{ secrets.MAX_CHAT }}
        run: |
          mkdir -p conf
          python3 - <<'PY'
          import os, json
          q = lambda v: json.dumps(v or '')
          open('conf/lead-config.php', 'w').write(
              "<?php return ['tg_token'=>%s, 'tg_chat'=>'-1004342114537', 'tg_thread'=>7932, 'max_token'=>%s, 'max_chat'=>%s];\n"
              % (q(os.environ.get('TG_TOKEN')), q(os.environ.get('MAX_TOKEN')), q(os.environ.get('MAX_CHAT'))))
          PY
      - name: Залить lead-config.php в www/ (рядом с папкой сайта)
        if: steps.chk.outputs.ok == 'yes'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./conf/
          server-dir: www/
          state-name: .ftp-deploy-conf.json
      - name: Залить site/ на хостинг
        if: steps.chk.outputs.ok == 'yes'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./site/
          server-dir: www/youz.store/
          exclude: |
            **/.git*
            **/.git*/**
            htaccess.txt
